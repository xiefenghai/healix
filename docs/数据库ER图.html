<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Healix 数据库 ER</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #1a2332;
    --muted: #5b6b7c;
    --line: #d7dee7;
    --accent: #0f7a6c;
    --accent-soft: #e6f4f1;
    --warn: #9a3412;
    --chip: #eef2f6;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #dff3ef 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #e8eef8 0%, transparent 50%),
      var(--bg);
  }
  .app {
    display: grid;
    grid-template-columns: 240px 1fr 380px;
    grid-template-rows: 64px 1fr;
    height: 100%;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: .02em;
  }
  header .meta { color: var(--muted); font-size: 13px; }
  header input {
    margin-left: auto;
    width: min(360px, 40vw);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    background: #fff;
  }
  nav {
    overflow: auto;
    padding: 14px 12px;
    border-right: 1px solid var(--line);
    background: rgba(255,255,255,.55);
  }
  nav button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  nav button:hover { background: #edf2f6; }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .count { color: var(--muted); font-size: 12px; }
  main {
    overflow: auto;
    padding: 18px;
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 14px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #9ec9c1; transform: translateY(-1px); }
  .card.selected { border-color: var(--accent); outline: 2px solid rgba(15,122,108,.18); }
  .card-h {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fbfcfd, #f7faf9);
  }
  .card-h .name { font-weight: 700; font-size: 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .card-h .desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.4; }
  .card-b { padding: 8px 10px 10px; }
  .cols { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
  .cols li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 8px;
    font-size: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .cols li:nth-child(odd) { background: #f8fafb; }
  .cols .t { color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    margin-left: 6px;
    vertical-align: 1px;
  }
  .badge.pk { background: #e8f0ff; color: #274690; }
  .badge.fk { background: #fff1e6; color: var(--warn); }
  aside {
    overflow: auto;
    border-left: 1px solid var(--line);
    background: rgba(255,255,255,.72);
    padding: 16px;
  }
  aside h2 { margin: 0 0 6px; font-size: 16px; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  aside .desc { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .rels {
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
  }
  .rels li {
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
    background: #fff;
  }
  .rels code { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--accent); }
  table.fields {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.fields th, table.fields td {
    text-align: left;
    padding: 8px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.fields th { color: var(--muted); font-weight: 600; font-size: 11px; }
  table.fields code { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 24px 8px;
  }
  .map {
    margin-bottom: 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .map h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .map-lines {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .edge {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #0b5c52;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    cursor: pointer;
    border: 1px solid #c9e6e0;
  }
  .edge:hover { background: #d5efe9; }

  .overview-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px 16px 8px;
    margin-bottom: 14px;
    overflow: auto;
  }
  .overview-wrap h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }
  .overview-wrap .sub {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .overview-svg {
    width: 100%;
    min-width: 860px;
    height: auto;
    display: block;
  }
  .overview-svg .lane {
    fill: #f7faf9;
    stroke: var(--line);
    stroke-width: 1;
  }
  .overview-svg .lane-title {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
  }
  .overview-svg .node {
    cursor: pointer;
  }
  .overview-svg .node rect {
    fill: #fff;
    stroke: #9ec9c1;
    stroke-width: 1.4;
    rx: 8;
  }
  .overview-svg .node.hub rect {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 1.8;
  }
  .overview-svg .node:hover rect {
    fill: #dff3ef;
    stroke: var(--accent);
  }
  .overview-svg .node text {
    fill: var(--ink);
    font-size: 11px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    pointer-events: none;
  }
  .overview-svg .node.hub text {
    font-weight: 700;
    font-size: 12px;
  }
  .overview-svg .edge {
    fill: none;
    stroke: #8aa8a2;
    stroke-width: 1.3;
    marker-end: url(#arrow);
  }
  .overview-svg .edge-label {
    fill: #5b6b7c;
    font-size: 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 8px 0 4px;
    color: var(--muted);
    font-size: 12px;
  }
  .legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
    border: 1px solid #9ec9c1;
    background: #fff;
  }
  .legend i.hub { background: var(--accent-soft); border-color: var(--accent); }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px 1fr; grid-template-rows: 64px 1fr auto; }
    aside { grid-column: 1 / -1; max-height: 40vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>

<div class="app">
  <header>
    <h1>Healix 数据库 ER</h1>
    <div class="meta">44 表 · 逻辑关联（无物理 FK）· 点击表看字段</div>

  <nav id="domains"></nav>

    <div class="map" id="map"></div>
    <div class="board" id="board"></div>
  </main>
  <aside id="detail"><div class="empty">选择左侧域或中间某张表，查看完整字段与关系。</div></aside>
</div>

function isFk(col) {
  return /(_id)$/.test(col) || ['tenant_id','people_id','org_id','staff_id','account_id','plan_id','task_id','batch_id','session_id','report_id','medication_id'].includes(col);
}

function domainOf(table) {
  return DATA.domains.find(d => d.tables.includes(table));
}

function goTable(name) {
  const dom = domainOf(name);
  if (dom) activeDomain = dom.id;
  selected = name;
  qEl.value = '';
  render();
  requestAnimationFrame(() => {
    document.querySelector(`.card[data-name="${name}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function goDomain(id) {
  activeDomain = id;
  selected = null;
  qEl.value = '';
  render();
}

function renderNav() {
  const overviewBtn = `<button data-id="overview" class="${activeDomain==='overview'?'active':''}">
      <span>整体总览</span><span class="count">图</span>
    </button>`;
  domainsEl.innerHTML = overviewBtn + DATA.domains.map(d => `
    <button data-id="${d.id}" class="${d.id===activeDomain?'active':''}">
      <span>${d.title}</span><span class="count">${d.tables.length}</span>
    </button>`).join('');
  domainsEl.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { activeDomain = btn.dataset.id; selected = null; qEl.value=''; render(); };
  });
}

function visibleTables() {
  const q = qEl.value.trim().toLowerCase();
  if (q) {
    return Object.keys(DATA.tables).filter(n => {
      const t = DATA.tables[n];
      if (n.toLowerCase().includes(q) || (t.comment||'').toLowerCase().includes(q)) return true;
      return t.cols.some(c => c.name.toLowerCase().includes(q) || (c.comment||'').toLowerCase().includes(q));
    });
  }
  if (activeDomain === 'overview') return [];
  return DATA.domains.find(d => d.id === activeDomain)?.tables || [];
}

function nodeBox(id, x, y, w, h, label, hub) {
  return `<g class="node ${hub?'hub':''}" data-table="${id}" transform="translate(${x},${y})">
    <rect width="${w}" height="${h}"></rect>
    <text x="${w/2}" y="${h/2+4}" text-anchor="middle">${label}</text>
  </g>`;
}

function renderMap(names) {
  if (activeDomain === 'overview' && !qEl.value.trim()) return;
  const set = new Set(names);
  const edges = DATA.rels.filter(r => set.has(r.from) && set.has(r.to));
  if (!edges.length) { mapEl.style.display = 'none'; return; }
  mapEl.style.display = 'block';
  mapEl.innerHTML = `<h3>本域关系</h3><div class="map-lines">${
    edges.map(e => `<span class="edge" data-from="${e.from}">${e.from} → ${e.to} <small>(${e.fk})</small></span>`).join('')
  }</div>`;
  mapEl.querySelectorAll('.edge').forEach(el => {
    el.onclick = () => goTable(el.dataset.from);
  });
}

function previewCols(t) {
  return t.cols.filter(c => c.name !== 'pk_id' && !AUDIT.has(c.name)).slice(0, 12);
}

function renderBoard(names) {
  if (activeDomain === 'overview' && !qEl.value.trim()) return;
  boardEl.innerHTML = names.map(n => {
    const t = DATA.tables[n];
    if (!t) return '';
    const cols = previewCols(t);
    return `<article class="card ${selected===n?'selected':''}" data-name="${n}">
      <div class="card-h">
        <div class="name">${n}</div>
        <div class="desc">${t.comment || ''}</div>
      </div>
      <div class="card-b"><ul class="cols">${cols.map(c => {
        let badge = '';
        if (c.name === 'id') badge = '<span class="badge pk">PK</span>';
        else if (isFk(c.name)) badge = '<span class="badge fk">FK</span>';
        return `<li><span>${c.name}${badge}</span><span class="t">${c.type}</span></li>`;
      }).join('')}${t.cols.length>cols.length+5?`<li><span>…共 ${t.cols.length} 字段</span><span></span></li>`:''}</ul></div>
    </article>`;
  }).join('');
  boardEl.querySelectorAll('.card').forEach(card => {
    card.onclick = () => { selected = card.dataset.name; renderBoard(names); renderDetail(); };
  });
}

function related(name) {
  const out = [];
  for (const r of DATA.rels) {
    if (r.from === name) out.push({dir:'→', other:r.to, fk:r.fk, card:r.card});
    if (r.to === name) out.push({dir:'←', other:r.from, fk:r.fk, card:r.card});
  }
  return out;
}

function renderDetail() {
  if (activeDomain === 'overview' && !selected && !qEl.value.trim()) return;
  if (!selected || !DATA.tables[selected]) {
    detailEl.innerHTML = '<div class="empty">选择左侧域或中间某张表，查看完整字段与关系。</div>';
    return;
  }
  const t = DATA.tables[selected];
  const rels = related(selected);
  const d = domainOf(selected);
  detailEl.innerHTML = `
    <h2>${selected}</h2>
    <div class="desc">${t.comment || ''}${d ? ` · ${d.title}` : ''}</div>
    <h3 style="font-size:13px;margin:0 0 8px;color:var(--muted)">关系</h3>
    ${rels.length ? `<ul class="rels">${rels.map(r => `<li>${r.dir} <code>${r.other}</code><br/><span style="color:var(--muted);font-size:12px">${r.fk} · ${r.card}</span></li>`).join('')}</ul>` : '<div class="empty" style="padding:8px 0">本表无登记的核心关系（或仅被 tenant_id 弱关联）</div>'}
    <h3 style="font-size:13px;margin:0 0 8px;color:var(--muted)">字段</h3>
    <table class="fields">
      <thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead>
      <tbody>
        ${t.cols.map(c => {
          let tag = '';
          if (c.name === 'id') tag = ' <span class="badge pk">PK</span>';
          else if (isFk(c.name)) tag = ' <span class="badge fk">FK</span>';
          return `<tr><td><code>${c.name}</code>${tag}</td><td>${c.type}${c.required?' *':''}</td><td>${c.comment||''}</td></tr>`;
        }).join('')}
      </tbody>
    </table>`;
  detailEl.querySelectorAll('.rels code').forEach(code => {
    code.style.cursor = 'pointer';
    code.onclick = () => goTable(code.textContent);
  });
}

function render() {
  renderNav();
  if (activeDomain === 'overview' && !qEl.value.trim()) {
    renderOverview();
    return;
  }
  const names = visibleTables();
  renderMap(names);
  renderBoard(names);
  renderDetail();
}

qEl.addEventListener('input', () => render());
render();
</script>
</body>
</html>
