# CareChat SSE 多实例：必须 sticky，否则推送可能打到无订阅的后端实例。
# 将下列片段并入现有 upstream / server 配置。

upstream healix_backend {
    # 方式 A：IP Hash（简单）
    ip_hash;
    server 10.0.0.11:8080;
    server 10.0.0.12:8080;

    # 方式 B（推荐）：cookie 粘滞（可与 ip_hash 二选一）
    # sticky cookie healix_sse expires=1h path=/;
    # server 10.0.0.11:8080;
    # server 10.0.0.12:8080;
}

server {
    # ...

    location /api/ {
        proxy_pass http://healix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Nginx：关闭对 SSE 的缓冲
        add_header X-Accel-Buffering no;
    }

    # 若只想对 events 加长超时，可单独：
    # location ~* /api/(b|c)/v1/care-chat/events$ {
    #     proxy_pass http://healix_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    # }
}
