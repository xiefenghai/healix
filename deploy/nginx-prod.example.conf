# Healix 生产 Nginx 示例：B 管理端 + C 端 H5 + /api 反代（含 SSE）
# 用法：替换 example.com 与证书路径；include 或复制到 sites-enabled 后 nginx -t && reload

upstream healix_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---- 共用 API / SSE 片段思路 ----
# proxy_http_version 1.1;
# proxy_set_header Connection "";
# proxy_buffering off;
# proxy_cache off;
# proxy_read_timeout 3600s;

# ========== B / Ops：admin.example.com ==========
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.example.com/privkey.pem;

    root /opt/healix/www/admin;
    index index.html;

    location /api/ {
        proxy_pass http://healix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========== C 端：m.example.com ==========
server {
    listen 80;
    server_name m.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name m.example.com;

    ssl_certificate     /etc/nginx/certs/m.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/m.example.com/privkey.pem;

    root /opt/healix/www/user;
    index index.html;

    location /api/ {
        proxy_pass http://healix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
