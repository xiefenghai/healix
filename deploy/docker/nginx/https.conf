# 备案通过 + 证书就绪后使用（.env 中 NGINX_CONF=https）
#   https://m.healixapp.com      → C 端 H5
#   https://admin.healixapp.com  → B / Ops 管理端
#   https://staff.healixapp.com  → 健管师/医生手机工作台
# 证书放在 deploy/docker/certs/<域名>/fullchain.pem 与 privkey.pem

upstream healix_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name m.healixapp.com;

    ssl_certificate     /etc/nginx/certs/m.healixapp.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/m.healixapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/user;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.healixapp.com;

    ssl_certificate     /etc/nginx/certs/admin.healixapp.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.healixapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/admin;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staff.healixapp.com;

    ssl_certificate     /etc/nginx/certs/staff.healixapp.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staff.healixapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/staff;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
