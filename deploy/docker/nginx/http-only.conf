# 备案通过前：用服务器公网 IP 访问
#   http://<IP>       → C 端 H5
#   http://<IP>:8081  → B / Ops 管理端（需在轻量服务器防火墙临时放行 8081）
#   http://<IP>:8082  → 健管师/医生手机工作台（需临时放行 8082）

upstream healix_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/user;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/admin;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/staff;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/api.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
