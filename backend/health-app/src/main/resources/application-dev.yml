spring:
  config:
    activate:
      on-profile: dev
    import: optional:classpath:application-local.yml
  influx:
    enabled: false

management:
  tracing:
    enabled: false

healix:
  agent:
    enabled: true
    ocr:
      # 验证 OCR 时用 VISION（图→JSON 一步）；生产可改回 TEXT_LLM
      mode: ${AGENT_OCR_MODE:VISION}
