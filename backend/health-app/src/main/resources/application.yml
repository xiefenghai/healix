spring:
  application:
    name: healix
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/healix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: healix
    password: healix
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 仅补建缺失表（IF NOT EXISTS），不 DROP、不清业务数据
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${ONE_API_BASE_URL:http://localhost:3000/v1}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.healix
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

healix:
  security:
    jwt-secret: ${JWT_SECRET:healix-dev-secret-key-change-me-32bytes!!}
    jwt-expiration-seconds: 86400
    id-card-aes-key: ${ID_CARD_AES_KEY:healix-dev-idcard-aes-key!!}
    id-card-pepper: ${ID_CARD_PEPPER:healix-dev-idcard-pepper}
  bootstrap:
    ops-username: ${OPS_BOOTSTRAP_USERNAME:opsadmin}
    ops-password: ${OPS_BOOTSTRAP_PASSWORD:OpsAdmin123!}
  agent:
    enabled: ${AGENT_LLM_ENABLED:false}
  influx:
    enabled: ${INFLUX_ENABLED:false}
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:healix-influx-token}
    org: ${INFLUX_ORG:healix}
    bucket: ${INFLUX_BUCKET:vitals}

logging:
  level:
    root: INFO
    com.healix: DEBUG
    org.springframework.ai: INFO
    dev.langchain4j: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
