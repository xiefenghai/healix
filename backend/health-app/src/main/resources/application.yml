spring:
  application:
    name: healix
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB
  datasource:
    url: jdbc:mysql://localhost:3306/healix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: healix
    password: healix
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 仅补建缺失表（IF NOT EXISTS），不 DROP、不清业务数据
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # 过渡期保留：healix.agent.* 未显式配置时回落读这些键（已不再依赖 Spring AI 运行时）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:sk-placeholder}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
          temperature: 0.3

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.healix
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

healix:
  public:
    # C 端用户站根地址，用于拼首诊填写短链
    user-base-url: ${HEALIX_USER_BASE_URL:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:healix-dev-secret-key-change-me-32bytes!!}
    jwt-expiration-seconds: 86400
    intake-link-jwt-seconds: ${HEALIX_INTAKE_LINK_JWT_SECONDS:7200}
    id-card-aes-key: ${ID_CARD_AES_KEY:healix-dev-idcard-aes-key!!}
    id-card-pepper: ${ID_CARD_PEPPER:healix-dev-idcard-pepper}
  bootstrap:
    ops-username: ${OPS_BOOTSTRAP_USERNAME:opsadmin}
    ops-password: ${OPS_BOOTSTRAP_PASSWORD:OpsAdmin123!}
  agent:
    enabled: ${AGENT_LLM_ENABLED:false}
    provider: deepseek
    api-key: ${DEEPSEEK_API_KEY:${spring.ai.openai.api-key:}}
    base-url: ${DEEPSEEK_BASE_URL:${spring.ai.openai.base-url:https://api.deepseek.com}}
    models:
      chat: ${DEEPSEEK_CHAT_MODEL:${spring.ai.openai.chat.options.model:deepseek-chat}}
      vision: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
    vision:
      api-key: ${VISION_API_KEY:${DEEPSEEK_API_KEY:${spring.ai.openai.api-key:}}}
      base-url: ${VISION_BASE_URL:${DEEPSEEK_BASE_URL:${spring.ai.openai.base-url:https://api.deepseek.com}}}
      model: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
    max-tokens: 8192
    timeout-seconds: 60
    llm:
      # 打印完整 system/user 请求体与模型返回；生产默认关，开发见 application-dev.yml
      log-request: ${AGENT_LLM_LOG_REQUEST:false}
    ocr:
      mode: ${AGENT_OCR_MODE:TEXT_LLM}
  influx:
    enabled: ${INFLUX_ENABLED:false}
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:healix-influx-token}
    org: ${INFLUX_ORG:healix}
    bucket: ${INFLUX_BUCKET:vitals}
  job:
    tick-ms: ${JOB_TICK_MS:60000}
    timeout-minutes: ${JOB_TIMEOUT_MINUTES:8}
  storage:
    local:
      dir: ${HEALIX_STORAGE_DIR:./data/objects}

logging:
  level:
    root: INFO
    com.healix: INFO
    com.healix.agent.llm: INFO
    com.healix.agent.ocr: INFO
    com.healix.agent.gateway: INFO
    dev.langchain4j: WARN
    # 未登录/无权限被拒是常态，不需要每次打完整 AccessDeniedException 堆栈
    org.springframework.security: WARN
    org.springframework.security.web.access: WARN
    org.springframework.security.authorization: WARN
    org.springframework.security.web.access.intercept.AuthorizationFilter: WARN
    org.springframework.security.web.ObservationFilterChainDecorator: WARN

# CareChat SSE 为进程内广播；多实例部署须对 /api/*/care-chat/events 做 sticky
# （参考仓库 deploy/nginx-care-chat-sse.example.conf），否则推送可能丢失、仅靠轮询兜底。

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
